name: esy CI
run-name: "esy CI ${{ inputs.leg || github.event_name }} ${{ inputs.racecar_run }}"

on:
  pull_request:
  push:
    branches:
    - master

  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: baseline
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""

permissions:
  contents: read
  id-token: write
env:
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        ocaml-compiler:
        - 4.14.x

    runs-on: ${{ matrix.os }}

    steps:
    - uses: crashappsec/action-checkout@main
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        lfs: false
    - uses: actions/setup-node@v7
      with:
        node-version: 24

    - name: Set up MinGW (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        choco upgrade mingw -y --no-progress
        echo "C:\ProgramData\mingw64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Install esy
      run: npm install -g esy@0.9.0-beta.1

    - name: Restore global cache (~/.esy/source)
      id: global-cache
      uses: actions/cache/restore@v6
      with:
        path: ~/.esy/source
        key: v0.0.2-esy-source-${{ matrix.os }}-${{ matrix.ocaml-compiler }}-${{ hashFiles('esy.lock.json') }}

    - name: Print esy cache
      id: print_esy_cache
      run: echo "ESY_CACHE=$(node .github/workflows/print-esy-cache.js)" >> $GITHUB_OUTPUT;

    - name: Load dependencies cache
      id: deps-cache
      uses: actions/cache/restore@v6
      with:
        path: |
          ${{ steps.print_esy_cache.outputs.ESY_CACHE }}
          _export
        key: v0.0.2-esy-build-${{ matrix.os }}-${{ matrix.ocaml-compiler }}-${{ hashFiles('esy.lock.json') }}
        restore-keys: v0.0.2-esy-build-${{ matrix.os }}-

    - name: Install dependencies
      run: esy install

    - name: Import dependencies
      if: steps.deps-cache.outputs.cache-hit == 'true'
        # Don't crash the run if esy cache import fails - mostly happens on Windows
      continue-on-error: true
      run: |
        esy import-dependencies _export
        rm -rf _export

    - name: Build dependencies
      run: esy build-dependencies

    - name: Build
      run: esy build

    - name: Test when not Windows
      if: runner.os != 'Windows'
      run: esy dune runtest

    - name: Test when Windows
      if: runner.os == 'Windows'
      run: esy b dune runtest -p "reason,rtop"

    - name: Export dependencies
      if: steps.deps-cache.outputs.cache-hit != 'true'
      run: esy export-dependencies

    - name: Save global cache
      uses: actions/cache/save@v6
      if: steps.global-cache.outputs.cache-hit != 'true'
      with:
        path: ~/.esy/source
        key: v0.0.2-esy-source-${{ matrix.os }}-${{ matrix.ocaml-compiler }}-${{ hashFiles('esy.lock.json') }}

    - name: Save dependencies cache
      if: steps.deps-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: |
          ${{ steps.print_esy_cache.outputs.ESY_CACHE }}
          _export
        key: v0.0.2-esy-build-${{ matrix.os }}-${{ matrix.ocaml-compiler }}-${{ hashFiles('esy.lock.json') }}

      # Cleanup build cache in case dependencies have changed
    - name: Cleanup
      if: steps.deps-cache.outputs.cache-hit != 'true'
      run: esy cleanup .
    - name: Check observables and crashes
      if: always() && env.CHALK_ON == 'true'
      shell: bash
      run: |
        set -uo pipefail
        root="${CURIOSITY_ROOT:-}"
        home="${CURIOSITY_HOME:-/mnt/curiosity}"
        obs="${home}/observables"
        fail=0

        echo "::group::curiosity layout"
        echo "CURIOSITY_ROOT=${root:-<unset>}"
        echo "CURIOSITY_HOME=${home}"
        ls -la "${obs}" 2>/dev/null || echo "no observables dir at ${obs}"
        echo "::endgroup::"

        # Observables for THIS run+attempt. The prefix matters: a stale file from an
        # earlier run on the same mount would otherwise pass.
        prefix="${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
        shopt -s nullglob
        mine=("${obs}/${prefix}"*)
        if [ ${#mine[@]} -eq 0 ]; then
          mine=("${obs}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-observables"*)
        fi
        if [ ${#mine[@]} -eq 0 ]; then
          echo "::error::no observables for run ${prefix} in ${obs} - instrumentation produced nothing"
          fail=1
        else
          echo "observables present: ${#mine[@]} file(s)"
          printf '  %s\n' "${mine[@]}"
        fi

        for f in "${mine[@]}"; do
          case "$f" in
            *.jsonl|*.json|*.combined)
              if ! jq --slurp "." "$f" > /dev/null 2>&1; then
                echo "::error::observables do not parse: $f"
                fail=1
              fi
              ;;
          esac
        done

        # Crash thresholds copied from check-run: a few null frames are noise, more than
        # five is a stack walk into nothing.
        for f in "${root}"/log/co-host*.log "${home}"/log/co-host*.log; do
          [ -f "$f" ] || continue
          echo "Asserting that there is no crash in $f"
          if [ "$(grep -c 'p 00000000' "$f" 2>/dev/null || echo 0)" -gt 5 ] \
            || [ "$(grep -E -c 'FATAL: Uncaught signal|Address not mapped at|RAX 0x.*RBX 0x' "$f" 2>/dev/null || echo 0)" -gt 1 ]; then
            echo "::error::crash signature in $f"
            grep -E 'FATAL: Uncaught signal|Address not mapped at' "$f" | head -5 || true
            fail=1
          fi
        done

        cores=("${root}"/coredump.* "${home}"/coredump.*)
        if [ ${#cores[@]} -gt 0 ]; then
          echo "::error::coredump present: ${cores[*]}"
          fail=1
        fi

        for f in "${root}"/runc.log "${root}"/runc.global.log \
                 "${home}"/runc.log "${home}"/runc.global.log; do
          [ -f "$f" ] || continue
          if grep -q '^E:' "$f"; then
            echo "::error::error in $f"
            grep '^E:' "$f" | head -5
            fail=1
          fi
        done

        if [ "$fail" -ne 0 ]; then
          echo "::error::instrumentation check FAILED"
          exit 1
        fi
        echo "instrumentation check passed"
